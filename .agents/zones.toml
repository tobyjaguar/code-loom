# Which parts of the tree agents may edit. Precedence: hand > assist > auto,
# first match wins; unmatched paths default to assist.
#
#   hand    agents may READ and may PROPOSE (tutor mode), never edit.
#           Your learning surface. Enforced by the pre-commit hook (loom install-hooks).
#   assist  agents edit, you review every diff line by line.
#   auto    agents edit, you review the summary.
#
# [fence] is a separate, stronger axis: fenced paths are physically REMOVED from
# agent worktrees (sparse checkout), so a non-Anthropic provider never sees them.
# It prevents incidental exposure, not exfiltration — see ARCHITECTURE.md § 5.
#
# Review changes to this file as carefully as you would a security policy.
# Zone creep is the quiet failure mode of this system.
#
# The paths below are the suggested boundary for audat: the compiler covers
# structural code, not numerical correctness. Edit honestly for your repo.

[hand]
reason = "Rust learning surface + DSP numerical correctness. Type system does not cover these."
paths = [
  "crates/audat-dsp/src/**",
  "crates/audat-core/src/restore/**",
]

[assist]
reason = "Structural code. Compiler catches most of what a cheap model gets wrong."
paths = [
  "crates/audat-cli/**",
  "crates/audat-io/**",
  "crates/*/tests/**",
  "crates/*/benches/**",
]

[auto]
reason = "Mechanical. Review the summary, not the diff."
paths = [
  "xtask/**",
  "docs/**",
  "**/fixtures/**",
  ".github/**",
]

# Optional. Uncomment to keep a subsystem out of every agent worktree entirely.
# Fence whole subsystems you also exclude from the gate: a fenced path that the
# build needs (a workspace member, a required module) breaks builds in the
# worktree, because it is genuinely not there.
#
# [fence]
# reason = "Client work under NDA — no third-party model sees this tree."
# paths = [
#   "crates/audat-nda/**",
#   "docs/audits/**",
# ]
